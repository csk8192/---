<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>체육대회 점수판</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
      padding: 30px;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 30px;
    }

    table {
      margin: auto;
      border-collapse: collapse;
      width: 95%;
      background: white;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 12px;
      font-size: 18px;
    }

    th {
      background: #4CAF50;
      color: white;
    }

    tr:nth-child(even) {
      background: #f9f9f9;
    }

    tr:hover {
      background: #eef;
    }
  </style>
</head>

<body>

<h1>🏆 체육대회 점수판</h1>

<table id="scoreTable">
  <thead>
    <tr>
      <th>반</th>
      <th>종목1</th>
      <th>종목2</th>
      <th>종목3</th>
      <th>종목4</th>
      <th>종목5</th>
      <th>종목6</th>
      <th>종목7</th>
      <th>총점</th>
      <th>순위</th>
    </tr>
  </thead>

  <tbody></tbody>
</table>

<script>

const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT-9aaEe4opawLLJhD247Pt48cVBsrDeaTT-aibVuNOJsRHcS9rBTos57n1_yXI3ZAUkBPi4mGVtcuo/pub?output=csv";

async function loadScores() {

  try {

    const response = await fetch(
      csvUrl + "&t=" + new Date().getTime()
    );

    const data = await response.text();

    const rows = data.split("\n").slice(1);

    let newHtml = "";

    rows.forEach(row => {

      const cols = row.split(",");

      if(cols.length > 1){

        newHtml += `
          <tr>
            <td>${cols[0] || ""}</td>
            <td>${cols[1] || ""}</td>
            <td>${cols[2] || ""}</td>
            <td>${cols[3] || ""}</td>
            <td>${cols[4] || ""}</td>
            <td>${cols[5] || ""}</td>
            <td>${cols[6] || ""}</td>
            <td>${cols[7] || ""}</td>
            <td>${cols[8] || ""}</td>
            <td>${cols[9] || ""}</td>
          </tr>
        `;
      }

    });

    document.querySelector("#scoreTable tbody").innerHTML = newHtml;

  } catch(error) {

    console.error("데이터 불러오기 실패:", error);

  }

}

loadScores();

setInterval(loadScores, 2000);

</script>

</body>
</html>
