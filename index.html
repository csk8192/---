<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>체육대회 점수판</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
      padding: 30px;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 30px;
    }

    table {
      margin: auto;
      border-collapse: collapse;
      width: 95%;
      background: white;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 12px;
      font-size: 18px;
    }

    th {
      background: #4CAF50;
      color: white;
    }

    tr:nth-child(even) {
      background: #f9f9f9;
    }

    tr:hover {
      background: #eef;
    }
  </style>
</head>

<body>

<h1>🏆 체육대회 점수판</h1>

<table id="scoreTable">
  <thead>
    <tr>
      <th>반</th>
      <th>전략 줄다리기</th>
      <th>팔자줄넘기</th>
      <th>점보스택스</th>
      <th>피구</th>
      <th>농구</th>
      <th>미션달리기</th>
      <th>계주</th>
      <th>총점</th>
      <th>순위</th>
    </tr>
  </thead>

  <tbody></tbody>
</table>

<script>

const sheetID = "11LGRBurdgaJbJ74_FF8ke_dQgvOYXFA1I2Ls3BFZJhU";

const url =
`https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json`;

let lastData = "";

async function loadScores() {

  try {

    const response = await fetch(
      url + "&t=" + Date.now()
    );

    const text = await response.text();

    const json = JSON.parse(
      text.substring(47).slice(0, -2)
    );

    const rows = json.table.rows;

    let html = "";

    rows.forEach(row => {

      html += "<tr>";

      row.c.forEach(cell => {

        html += `<td>${cell ? cell.v : ""}</td>`;

      });

      html += "</tr>";

    });

    if(html !== lastData){

      document.querySelector("#scoreTable tbody").innerHTML = html;
      lastData = html;

    }

  } catch(err) {

    console.log(err);

  }

}

loadScores();

setInterval(loadScores, 3000);

</script>

</body>
</html>
