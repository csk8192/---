<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>체육대회 점수판</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #0f172a, #1e293b);
      color: white;
      padding: 30px;
    }

    h1 {
      text-align: center;
      font-size: 60px;
      margin-bottom: 50px;
    }

    /* 시상대 */

    .podium-container {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 25px;
      margin-bottom: 70px;
      flex-wrap: wrap;
    }

    .podium {
      width: 220px;
      border-radius: 25px 25px 0 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 25px;
      font-weight: bold;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      transition: 0.3s;
    }

    .podium:hover {
      transform: translateY(-8px);
    }

    .first {
      height: 360px;
      background: gold;
      color: black;
      order: 2;
    }

    .second {
      height: 290px;
      background: silver;
      color: black;
      order: 1;
    }

    .third {
      height: 240px;
      background: #cd7f32;
      color: white;
      order: 3;
    }

    .rank-number {
      font-size: 60px;
      margin-bottom: 20px;
    }

    .class-name {
      font-size: 40px;
      margin-bottom: 15px;
    }

    .score {
      font-size: 30px;
    }

    /* 4위 이하 */

    .others {
      max-width: 900px;
      margin: auto;
      margin-bottom: 70px;
    }

    .others h2 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 40px;
    }

    .other-row {
      background: rgba(255,255,255,0.1);
      padding: 20px 30px;
      border-radius: 18px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      font-size: 30px;
      backdrop-filter: blur(5px);
    }

    /* 상세표 */

    .table-title {
      text-align: center;
      font-size: 50px;
      margin-bottom: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      color: black;
      border-radius: 15px;
      overflow: hidden;
      table-layout: fixed;
    }

    th {
      background: #2563eb;
      color: white;
      padding: 18px;
      font-size: 22px;
    }

    td {
      padding: 16px;
      border-bottom: 1px solid #ddd;
      text-align: center;
      font-size: 22px;
    }

    th, td {
      word-break: keep-all;
    }

    tr:nth-child(even) {
      background: #f1f5f9;
    }

    /* 모바일 */

    @media(max-width: 768px){

      h1 {
        font-size: 42px;
      }

      .podium-container {
        flex-direction: column;
        align-items: center;
      }

      .first, .second, .third {
        width: 90%;
        height: auto;
        min-height: 200px;
      }

      .rank-number {
        font-size: 48px;
      }

      .class-name {
        font-size: 32px;
      }

      .score {
        font-size: 24px;
      }

      .other-row {
        font-size: 22px;
      }

      table {
        font-size: 12px;
        overflow-x: auto;
        display: block;
      }

    }

  </style>
</head>

<body>

<h1>🎖 체육대회 실시간 순위 🎖</h1>

<!-- 시상대 -->

<div class="podium-container" id="podiumContainer"></div>

<!-- 4위 이하 -->

<div class="others">
  <h2>📋 전체 순위</h2>
  <div id="otherRanks"></div>
</div>

<!-- 상세표 -->

<h2 class="table-title"> 상세 점수표</h2>

<table id="scoreTable">

  <thead>
    <tr>
      <th>반</th>
      <th>전략줄다리기</th>
      <th>팔자줄넘기</th>
      <th>점보스택스</th>
      <th>피구</th>
      <th>농구</th>
      <th>미션달리기</th>
      <th>계주</th>
      <th>총점</th>
      <th>순위</th>
    </tr>
  </thead>

  <tbody></tbody>

</table>

<script>

const sheetID = "11LGRBurdgaJbJ74_FF8ke_dQgvOYXFA1I2Ls3BFZJhU";

const url =
`https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json`;

let lastData = "";

async function loadScores() {

  try {

    const response = await fetch(
      url + "&t=" + Date.now()
    );

    const text = await response.text();

    const json = JSON.parse(
      text.substring(47).slice(0, -2)
    );

    const rows = json.table.rows;

    let html = "";

    let teams = [];

    rows.forEach(row => {

      const cols = row.c.map(cell => cell ? cell.v : "");

      teams.push({
        className: cols[0],
        total: Number(cols[8]) || 0,
        rank: Number(cols[9]) || 0,
        data: cols
      });

      html += "<tr>";

      cols.forEach(col => {
        html += `<td>${col}</td>`;
      });

      html += "</tr>";

    });

    teams.sort((a,b) => a.rank - b.rank);

    if(html !== lastData){

      document.querySelector("#scoreTable tbody").innerHTML = html;

      updatePodium(teams);

      lastData = html;

    }

  } catch(err) {

    console.log(err);

  }

}

function updatePodium(teams){

  const podiumContainer = document.getElementById("podiumContainer");
  const otherRanks = document.getElementById("otherRanks");

  podiumContainer.innerHTML = "";
  otherRanks.innerHTML = "";

  const top3 = teams.slice(0,3);

  const classes = ["first", "second", "third"];

  top3.forEach((team, index) => {

    const div = document.createElement("div");

    div.className = `podium ${classes[index]}`;

    div.innerHTML = `
      <div class="rank-number">${team.rank}위</div>
      <div class="class-name">${team.className}</div>
      <div class="score">${team.total}점</div>
    `;

    podiumContainer.appendChild(div);

  });

  teams.slice(3).forEach(team => {

    const row = document.createElement("div");

    row.className = "other-row";

    row.innerHTML = `
      <span>${team.rank}위</span>
      <span>${team.className}</span>
      <span>${team.total}점</span>
    `;

    otherRanks.appendChild(row);

  });

}

loadScores();

setInterval(loadScores, 3000);

</script>

</body>
</html>
