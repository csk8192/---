<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>체육대회 점수판</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial, sans-serif;

      background:
      linear-gradient(
        to bottom,
        #081226,
        #0f172a
      );

      color:white;

      padding:30px;

      overflow-x:hidden;
    }

    h1{
      text-align:center;

      font-size:70px;

      margin-bottom:70px;

      font-weight:900;

      letter-spacing:-2px;
    }

    /* 시상대 */

    .podium-container{
      display:flex;

      justify-content:center;

      align-items:flex-end;

      gap:30px;

      margin-bottom:80px;

      flex-wrap:wrap;
    }

    .podium{

      width:260px;

      border-radius:35px 35px 0 0;

      display:flex;

      flex-direction:column;

      align-items:center;

      justify-content:flex-start;

      padding:45px 20px 30px;

      font-weight:bold;

      text-align:center;

      position:relative;

      overflow:hidden;

      transition:0.35s;

      box-shadow:
      0 15px 40px rgba(0,0,0,0.35);

    }

    .podium:hover{
      transform:translateY(-10px);
    }

    .first{

      height:640px;

      background:
      linear-gradient(
        to bottom,
        #ffe600,
        #facc15
      );

      color:black;

      order:2;

      box-shadow:
      0 0 35px rgba(255,215,0,0.8),
      0 0 70px rgba(255,215,0,0.35);

    }

    .second{

      height:560px;

      background:
      linear-gradient(
        to bottom,
        #e2e2e2,
        #bdbdbd
      );

      color:black;

      order:1;

    }

    .third{

      height:500px;

      background:
      linear-gradient(
        to bottom,
        #d98a34,
        #b96a1b
      );

      color:white;

      order:3;

    }

    .rank-number{

      font-size:78px;

      line-height:1;

      margin-bottom:30px;

      font-weight:900;

    }

    .team-image{

      width:150px;
      height:150px;

      object-fit:cover;

      border-radius:30px;

      margin-bottom:30px;

      border:5px solid rgba(255,255,255,0.92);

      background:white;

      display:block;

      box-shadow:
      0 8px 25px rgba(0,0,0,0.28);

    }

    .first .team-image{
      width:180px;
      height:180px;
    }

    .class-name{

      font-size:56px;

      margin-bottom:18px;

      font-weight:900;

    }

    .score{

      font-size:44px;

      font-weight:900;

    }

    /* 4위 이하 */

    .others{
      max-width:1000px;

      margin:auto;

      margin-bottom:80px;
    }

    .others h2{

      text-align:center;

      margin-bottom:30px;

      font-size:42px;

      font-weight:900;

    }

    .other-row{

      background:rgba(255,255,255,0.08);

      padding:22px 35px;

      border-radius:20px;

      margin-bottom:16px;

      display:flex;

      justify-content:space-between;

      font-size:30px;

      backdrop-filter:blur(6px);

      transition:0.25s;

    }

    .other-row:hover{
      background:rgba(255,255,255,0.14);
      transform:scale(1.01);
    }

    /* 상세표 */

    .table-title{

      text-align:center;

      font-size:52px;

      margin-bottom:35px;

      font-weight:900;

    }

    table{

      width:100%;

      border-collapse:collapse;

      background:white;

      color:black;

      border-radius:20px;

      overflow:hidden;

      table-layout:fixed;

    }

    th{

      background:#2563eb;

      color:white;

      padding:18px;

      font-size:28px;

      line-height:1.5;

      vertical-align:middle;

    }

    td{

      padding:18px;

      border-bottom:1px solid #ddd;

      text-align:center;

      font-size:28px;

      vertical-align:middle;

    }

    th, td{
      word-break:keep-all;
    }

    tr:nth-child(even){
      background:#f1f5f9;
    }

    /* 모바일 */

    @media(max-width:768px){

      body{
        padding:15px;
      }

      h1{
        font-size:42px;
        margin-bottom:40px;
      }

      .podium-container{
        flex-direction:column;
        align-items:center;
      }

      .first,
      .second,
      .third{

        width:95%;

        height:auto;

        min-height:320px;

      }

      .first{
        order:1;
      }

      .second{
        order:2;
      }

      .third{
        order:3;
      }

      .rank-number{
        font-size:56px;
      }

      .team-image{

        width:110px;
        height:110px;

      }

      .first .team-image{

        width:130px;
        height:130px;

      }

      .class-name{
        font-size:38px;
      }

      .score{
        font-size:30px;
      }

      .others h2{
        font-size:34px;
      }

      .other-row{

        font-size:22px;

        padding:18px;

      }

      .table-title{
        font-size:36px;
      }

      table{
        display:block;
        overflow-x:auto;
        white-space:nowrap;
      }

      th{

        font-size:18px;

        padding:12px;

        min-width:90px;

      }

      td{

        font-size:18px;

        padding:12px;

        min-width:90px;

      }

    }

  </style>
</head>

<body>

<h1>🏅 체육대회 실시간 순위 🏅</h1>

<!-- 시상대 -->

<div
  class="podium-container"
  id="podiumContainer">
</div>

<!-- 4위 이하 -->

<div class="others">

  <h2>전체 순위</h2>

  <div id="otherRanks"></div>

</div>

<!-- 상세표 -->

<h2 class="table-title">
  상세 점수표
</h2>

<table id="scoreTable">

  <thead>

    <tr>
      <th>반</th>
      <th>전략<br>줄다리기</th>
      <th>팔자<br>줄넘기</th>
      <th>점보<br>스택스</th>
      <th>피구</th>
      <th>농구</th>
      <th>미션<br>달리기</th>
      <th>계주</th>
      <th>총점</th>
      <th>순위</th>
    </tr>

  </thead>

  <tbody></tbody>

</table>

<script>

const sheetID =
"11LGRBurdgaJbJ74_FF8ke_dQgvOYXFA1I2Ls3BFZJhU";

const url =
`https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json`;

/* 반 사진 */

const teamImages = {

  "1-1": "1-1반사진URL",
  "1-2": "1-2반사진URL",
  "1-3": "1-3반사진URL",
  "1-4": "1-4반사진URL",
  "1-5": "1-5반사진URL",

  "2-1":
  "https://i.imgur.com/8oipbXD.jpeg",

  "2-2":
  "https://i.imgur.com/AmDrQKp.png",

  "2-3":
  "https://i.imgur.com/TEPDOy9.jpeg",

  "2-4":
  "https://i.imgur.com/igmtQDB.jpeg"

};

const medals = [
  "🥇",
  "🥈",
  "🥉"
];

let lastData = "";

async function loadScores(){

  try{

    const response = await fetch(
      url + "&t=" + Date.now()
    );

    const text =
    await response.text();

    const json = JSON.parse(
      text.substring(47).slice(0, -2)
    );

    const rows =
    json.table.rows;

    let html = "";

    let teams = [];

    rows.forEach(row => {

      const cols =
      row.c.map(
        cell => cell ? cell.v : ""
      );

      teams.push({

        className: cols[0],

        total:
        Number(cols[8]) || 0,

        rank:
        Number(cols[9]) || 0,

        data: cols

      });

      html += "<tr>";

      cols.forEach(col => {

        html += `<td>${col}</td>`;

      });

      html += "</tr>";

    });

    teams.sort(
      (a,b) => a.rank - b.rank
    );

    if(html !== lastData){

      document.querySelector(
        "#scoreTable tbody"
      ).innerHTML = html;

      updatePodium(teams);

      lastData = html;

    }

  }catch(err){

    console.log(err);

  }

}

function updatePodium(teams){

  const podiumContainer =
  document.getElementById(
    "podiumContainer"
  );

  const otherRanks =
  document.getElementById(
    "otherRanks"
  );

  podiumContainer.innerHTML = "";

  otherRanks.innerHTML = "";

  const top3 =
  teams.slice(0,3);

  const classes = [
    "first",
    "second",
    "third"
  ];

  top3.forEach((team, index) => {

    const div =
    document.createElement("div");

    div.className =
    `podium ${classes[index]}`;

    div.innerHTML = `

      <div class="rank-number">
        ${medals[index]}
      </div>

      ${teamImages[team.className] ? `

        <img
          src="${teamImages[team.className]}"
          class="team-image"
        >

      ` : ''}

      <div class="class-name">
        ${team.className}
      </div>

      <div class="score">
        ${team.total}점
      </div>

    `;

    podiumContainer.appendChild(div);

  });

  teams.slice(3).forEach(team => {

    const row =
    document.createElement("div");

    row.className = "other-row";

    row.innerHTML = `
      <span>${team.rank}위</span>
      <span>${team.className}</span>
      <span>${team.total}점</span>
    `;

    otherRanks.appendChild(row);

  });

}

loadScores();

setInterval(loadScores, 3000);

</script>

</body>
</html>
